volumes:
  postgres-data:
  redis-data:
  compliance-target:

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3004
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_HOST: postgres
  DB_PASSWORD: password
  DB_PORT: 5432
  # Serves Swagger UI and /api-docs/openapi.json: dev and test stacks only, never production.
  API_DOCS_ENABLED: "true"
  # Traces OpenTelemetry (MAIR-503), off unless an OTLP/HTTP endpoint is set, e.g. a local
  # collector listening on the host: OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
  # OTEL_SERVICE_NAME: compliance-api

services:
  postgres:
    image: ghcr.io/mairie360/database:dev-fb7c223
    restart: always
    container_name: mairie360-db-compliance-api
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:dev-fb7c223
    container_name: mairie360-liquibase-compliance-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 refuses to seed the admin (users.id = 1) without credentials: this
    # throwaway stack uses the public template admin. Never pass the flag on a real instance.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql
    # On se connecte directement au service 'postgres' via son nom de service
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-compliance-api
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  compliance:
    container_name: compliance_api-developpement
    build:
      context: .
      dockerfile: development.Dockerfile
    develop:
      watch:
        - action: sync
          path: ./src
          target: /usr/src/compliance/src
        - action: sync
          path: ./Cargo.toml
          target: /usr/src/compliance/Cargo.toml
        - action: sync
          path: ./Cargo.lock
          target: /usr/src/compliance/Cargo.lock
    ports:
      - "3004:3004"
    volumes:
      - compliance-target:/usr/src/compliance/target
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      PUBLIC_URL: http://compliance.development.mairie360.fr
      # Public test value, known to every reader of this repo: mairie360_api_lib refuses to start
      # with it unless JWT_ALLOW_WEAK_SECRET is set. Dev/test stacks only, never a deployment, where
      # JWT_SECRET is a random value of at least 32 bytes, distinct per instance (MAIR-428).
      JWT_SECRET: b"secret"
      JWT_TIMEOUT: 3600
      JWT_ALLOW_WEAK_SECRET: "true"
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://compliance:3004/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  nginx:
    image: nginx:1.29.1-bookworm
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    networks:
      - backend
    depends_on:
      compliance:
        condition: service_healthy
    extra_hosts:
      - "compliance.development.mairie360.fr:127.0.0.1"
