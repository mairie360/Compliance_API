# Integration test stack (MAIR-117): the same services as docker-compose.yml plus a `newman`
# runner that replays the committed Postman collection against the API over the compose network.
# Run it with ./integration_test.sh (this is what the CICD `integration_tests` job executes).
volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3004
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_HOST: postgres
  DB_PASSWORD: password
  DB_PORT: 5432
  # Serves Swagger UI and /api-docs/openapi.json: dev and test stacks only, never production.
  API_DOCS_ENABLED: "true"

services:
  postgres:
    image: ghcr.io/mairie360/database:dev-fb7c223
    restart: always
    container_name: mairie360-db-compliance-api-integration
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:dev-fb7c223
    container_name: mairie360-liquibase-compliance-api-integration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 refuses to seed the admin (users.id = 1) without credentials: this
    # throwaway stack uses the public template admin. Never pass the flag on a real instance.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-compliance-api-integration
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Seeds the extra test user (id 2) for collections that need a second account.
  seeder:
    image: postgres:18-alpine
    container_name: mairie360-seeder-compliance-api-integration
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    networks:
      - backend

  compliance:
    container_name: compliance-api-integration
    # The API under test: the published ghcr.io/mairie360/compliance-api:dev-<sha> image in CI, or
    # compliance-api:local built by the *_test.sh script from development.Dockerfile. No build: block,
    # so CI tests the artifact that gets promoted instead of recompiling the sources.
    image: ${IMAGE_REF:?IMAGE_REF must name the API image under test, run the matching *_test.sh script}
    restart: always
    expose:
      - "3004"
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      PUBLIC_URL: http://compliance.development.mairie360.fr
      # Public test value, known to every reader of this repo: mairie360_api_lib refuses to start
      # with it unless JWT_ALLOW_WEAK_SECRET is set. Dev/test stacks only, never a deployment, where
      # JWT_SECRET is a random value of at least 32 bytes, distinct per instance (MAIR-428).
      JWT_SECRET: b"secret"
      JWT_TIMEOUT: 3600
      JWT_ALLOW_WEAK_SECRET: "true"
    depends_on:
      seeder:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The published image is distroless (no shell, no curl), so the API cannot carry its own
  # healthcheck: this sidecar polls /ready (Postgres and Redis reachable) and the services that
  # need the API wait for it to complete instead.
  compliance-ready:
    image: curlimages/curl:latest
    depends_on:
      compliance:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://compliance:3004/ready >/dev/null; do
      echo "waiting for compliance..."; sleep 2; done; echo "compliance ready"'
    networks:
      - backend

  # Replays tests/postman/collection.json against the `compliance` service. `baseUrl` is injected
  # here so the committed environment stays usable from a host shell (http://localhost:3004).
  # `--bail` stops at the first failing request; the exit code is what integration_test.sh returns.
  newman:
    image: postman/newman:6.1.3-alpine
    container_name: mairie360-newman-compliance-api
    networks:
      - backend
    volumes:
      - ./tests/postman:/etc/newman:ro
    depends_on:
      compliance-ready:
        condition: service_completed_successfully
    command: >
      run /etc/newman/collection.json
      --environment /etc/newman/environment.json
      --env-var baseUrl=http://compliance:3004
      --bail
