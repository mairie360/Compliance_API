name: API CI/CD

# Pull requests run lint, build and tests; a push to `main` also runs the releases and the
# integration, ZAP and k6 stacks (the reusable workflow gates them on `refs/heads/main`).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  APIs-cicd:
    # [NOUVEAU] MAIR-493 : TEMPORAIRE, test de mairie360/CICD#142. Repasser `uses` et `cicd_version` sur le tag publie avant merge.
    uses: mairie360/CICD/.github/workflows/APIs_cicd.yml@mair-493-actions-by-check-and-stack
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      package_name: template-api # change api name
      cicd_version: mair-493-actions-by-check-and-stack
    # Only the secrets the reusable workflow declares, instead of `secrets: inherit`.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
