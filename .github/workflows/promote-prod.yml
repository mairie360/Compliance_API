name: Promote to Prod

# MAIR-494: manual promotion of a commit of main to prod (mairie360/CICD promote-prod.yml).
# `gh workflow run promote-prod.yml [-f sha=<sha>]`; the Prod environment approval still applies.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit of main to promote (empty: main's newest commit released on staging)"
        required: false
        type: string

permissions:
  contents: read

# One promotion at a time per repo and target.
concurrency:
  group: promote-${{ github.repository }}-prod
  cancel-in-progress: false

jobs:
  promote:
    permissions:
      contents: write
      packages: write
      actions: read
    uses: mairie360/CICD/.github/workflows/promote-prod.yml@v4.4.0
    with:
      stack: apis
      package_name: template-api
      cicd_version: v4.4.0
      sha: ${{ inputs.sha }}
    secrets:
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PK: ${{ secrets.RELEASE_APP_PK }}
