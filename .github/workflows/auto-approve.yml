name: Auto Approve Renovate
# The reusable workflow of mairie360/CICD approves a Renovate pull request only while Renovate alone
# wrote and pushed its branch, and takes the approval back after any other push.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  auto-approve:
    permissions:
      pull-requests: write
    uses: mairie360/CICD/.github/workflows/auto-approve.yml@v5.14.0
    with:
      cicd_version: v5.14.0   # same release as the `uses:` ref
