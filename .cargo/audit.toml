# Advisories ignored on purpose. Every entry says which code path would reach the crate and when it
# was last triaged. Re-check each one when its crate is bumped and drop it as soon as a fixed version
# is reachable. The "Review by" date is when the entry must be looked at again: keep it only while no
# fixed version is reachable and its reasoning still holds, otherwise drop it. The eight Rust repos
# (API_lib, API_template, Core, Project, Calendar, Message, ELearning, Compliance) keep this file
# identical: change it in one, port it to the others.
[advisories]
ignore = [
    # rsa (Marvin attack): timing leak of an RSA *private* key during decryption / signing, fixed in
    # rsa >= 0.10.0. Pulled by jsonwebtoken 11 (`rust_crypto`), which this crate only uses to sign
    # and verify HMAC and EdDSA tokens (mairie360_api_lib refuses any other algorithm): no RSA key
    # is ever loaded. jsonwebtoken 12.0.0 (2026-11-13) uses rsa 0.10: drop this entry when the repos
    # move to it, or at once if code starts using RSA.
    # Triaged 2026-11-20. Review by 2027-02-20.
    "RUSTSEC-2023-0071",
    # h2 0.3 (via actix-http 3), unbounded empty DATA frames: HTTP/2 denial of service (memory
    # growth, no data exposure), fixed in h2 >= 0.4.16. actix-http 3 still pins h2 0.3. This path IS
    # reachable: HttpServer::bind accepts cleartext HTTP/2 (h2c) by default and no API calls
    # `auto_h2c(false)`, so any client that can reach the listener can use it. Kept for lack of a
    # reachable fix; `auto_h2c(false)` would close the path. Drop it once actix-http moves to h2 0.4.
    # Triaged 2026-11-20. Review by 2027-02-20.
    "RUSTSEC-2026-0258",
    # crypto-bigint 0.5 (timing variability of operations meant to be constant-time), fixed in
    # crypto-bigint >= 0.7.6, which elliptic-curve 0.13 cannot use. Pulled by jsonwebtoken 11
    # through p256/p384, so only ES256/ES384 operations reach it; these crates only sign and verify
    # HMAC and EdDSA tokens (any other algorithm is refused before verification), so the code is
    # never run. jsonwebtoken 12.0.0 (2026-11-13) moves to p256/p384 0.14: drop this entry when the
    # repos move to it, or at once if code starts using an EC key.
    # Triaged 2026-11-20. Review by 2027-02-20.
    "RUSTSEC-2026-0387",
    # libsqlite3-sys 0.37 (C SQLite CVE-2026-119375, fixed in >= 0.39). It is only listed in
    # Cargo.lock through sqlx's weak `sqlx-sqlite?/...` features: `cargo tree -i libsqlite3-sys
    # --target all --all-features` prints nothing, it is never compiled into the binary. sqlx 0.9
    # pins 0.37. Drop it once sqlx moves to libsqlite3-sys >= 0.39.
    # Triaged 2026-11-20. Review by 2027-02-20.
    "RUSTSEC-2026-0459"
]
