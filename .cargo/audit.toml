# Every ignored advisory says why it does not apply and when to drop it (MAIR-427).
[advisories]
ignore = [
    # rsa (Marvin attack, no patched release): timing leak of an RSA *private* key during
    # decryption / signing. Pulled by jsonwebtoken, which the APIs use for HS256 tokens and to
    # *verify* Keycloak RS256 tokens with the realm's public key: no RSA private key is ever loaded.
    # Drop it once jsonwebtoken ships a fixed rsa, or if an API starts signing with RSA.
    "RUSTSEC-2023-0071",
    # h2 0.3 (unbounded empty DATA frames, fixed in 0.4.16 only): pulled by actix-http's default
    # `http2` feature, which the lib and utoipa-swagger-ui enable. `main.rs` binds plain HTTP/1.1
    # (`HttpServer::bind`, no TLS, no h2c), so no HTTP/2 frame is ever parsed. Drop it once actix-http
    # moves to h2 0.4.
    "RUSTSEC-2026-0258",
    # zip 8 (build-dependency of utoipa-swagger-ui 10, which requires zip ^8.6), unconfined
    # permissions, symlinks and SUID bits on extraction (fixed in zip >= 9.0.0). zip only runs in
    # utoipa-swagger-ui's build script, extracting the Swagger UI archive it ships, never an
    # archive from a user, and is not in the binary. Drop these once utoipa-swagger-ui moves to zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # crypto-bigint 0.5 (timing variability of operations meant to be constant-time; fixed in
    # 0.7.6, which elliptic-curve 0.13 cannot use). Pulled by jsonwebtoken 11.1 (the latest
    # release, through p256/p384), used directly by `src/auth.rs` (HS256 only, no EC key) and via
    # mairie360_api_lib, which only *verifies* ES256/ES384 Keycloak signatures with public keys: no
    # secret goes through these operations. Drop it once jsonwebtoken moves to elliptic-curve
    # 0.14, and remove it at once if code starts signing with (or otherwise using) an EC private
    # key.
    "RUSTSEC-2026-0387",
]
