# Masking patterns of the logs (MAIR-498): personal data a log line must never carry, replaced
# before storage by the OpenTelemetry Collector of the instance (Devops/Deploiment, transform
# processor, `replace_pattern`), served by GET /api/v1/masking-patterns. RE2 syntax (the
# collector's), case-insensitive flag inline. IP addresses are not masked: they are kept for
# security by decision (2026-10-08, compliance/<org>/retention.yaml).
version: 1
patterns:
  - name: email
    regex: '(?i)[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}'
    replacement: '<email>'
  - name: phone_fr
    regex: '(?:\+33\s?|0)[1-9](?:[\s.-]?\d{2}){4}'
    replacement: '<phone>'
  - name: jwt
    regex: 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'
    replacement: '<jwt>'
  - name: bearer
    regex: '(?i)bearer\s+[A-Za-z0-9._~+/=-]{16,}'
    replacement: 'Bearer <token>'
  - name: password_hash
    regex: '\$argon2(?:id|i|d)\$[^\s"''}]+'
    replacement: '<hash>'
